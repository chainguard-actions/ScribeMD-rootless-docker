name: Test rootless Docker idempotency
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run rootless Docker action first time
        id: rootless-first
        uses: .
        continue-on-error: true
      - name: Assert first run completed (success or graceful failure)
        env:
          INSTALLED: ${{ steps.rootless-first.outputs.INSTALLED }}
          IN_USE: ${{ steps.rootless-first.outputs.IN_USE }}
          OUTCOME: ${{ steps.rootless-first.outcome }}
        run: |
          echo "First run outcome: $OUTCOME"
          echo "First run INSTALLED: '$INSTALLED'"
          echo "First run IN_USE: '$IN_USE'"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$INSTALLED" != "true" ] && [ "$INSTALLED" != "false" ]; then
              echo "FAIL: action succeeded but INSTALLED output is invalid: '$INSTALLED'"
              exit 1
            fi
            if [ "$IN_USE" != "true" ] && [ "$IN_USE" != "false" ]; then
              echo "FAIL: action succeeded but IN_USE output is invalid: '$IN_USE'"
              exit 1
            fi
            echo "PASS: First run succeeded with valid outputs"
          else
            echo "INFO: First run did not fully succeed (outcome=$OUTCOME)"
            echo "INFO: This is expected in environments without systemd (e.g., act)"
            echo "PASS: First run failed gracefully"
          fi
      - name: Run rootless Docker action second time (idempotency check)
        id: rootless-second
        uses: .
        continue-on-error: true
      - name: Assert idempotency - second run completed (success or graceful failure)
        env:
          OUTCOME_FIRST: ${{ steps.rootless-first.outcome }}
          OUTCOME_SECOND: ${{ steps.rootless-second.outcome }}
          INSTALLED_SECOND: ${{ steps.rootless-second.outputs.INSTALLED }}
          IN_USE_SECOND: ${{ steps.rootless-second.outputs.IN_USE }}
        run: |
          echo "First run outcome: $OUTCOME_FIRST"
          echo "Second run outcome: $OUTCOME_SECOND"
          echo "Second run INSTALLED: '$INSTALLED_SECOND'"
          echo "Second run IN_USE: '$IN_USE_SECOND'"
          if [ "$OUTCOME_FIRST" = "success" ] && [ "$OUTCOME_SECOND" = "success" ]; then
            # Both runs succeeded - verify idempotency
            if [ "$INSTALLED_SECOND" != "true" ]; then
              echo "FAIL: After first successful run, second run should detect rootless as installed"
              exit 1
            fi
            if [ "$IN_USE_SECOND" != "true" ]; then
              echo "FAIL: After first successful run, second run should detect rootless as in-use"
              exit 1
            fi
            echo "PASS: Second run correctly detected rootless as installed and in-use (idempotent)"
          else
            echo "INFO: Not both runs succeeded (first=$OUTCOME_FIRST, second=$OUTCOME_SECOND)"
            echo "INFO: This is expected in environments without systemd (e.g., act)"
            echo "PASS: Idempotency check - both runs failed gracefully as expected"
          fi
