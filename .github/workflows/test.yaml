name: Test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    permissions:
      contents: write # for pre-commit-action
    steps:
      - name: Check out repository.
        uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3.1.0
        with:
          fetch-depth: 0
      - name: Use Docker in rootless mode.
        uses: ./
      - name: Run pre-commit hooks.
        uses: ScribeMD/pre-commit-action@2577ac8d5eb4e2f1c2557a34d1b6dcb2e2c86db9 # 0.9.16
      - name: Send Slack notification with job status.
        if: always()
        uses: ScribeMD/slack-templates@3c4515ed8a8fcd16b49844b4473c410eef85de60 # 0.6.11
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: ${{ secrets.SLACK_ACTIONS_CHANNEL_ID }}
          template: result
