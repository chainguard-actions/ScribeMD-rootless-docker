name: Test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    permissions:
      contents: write # for pre-commit-action
    steps:
      - name: Check out repository.
        uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b # v3.0.2
        with:
          fetch-depth: 0
      - name: Use Docker in rootless mode.
        uses: ./
      - name: Run pre-commit hooks.
        uses: ScribeMD/pre-commit-action@9deb7b526d077f1be37d9b0e345189343311b045 # 0.9.7
      - name: Send Slack notification with job status.
        if: always()
        uses: ScribeMD/slack-templates@0c6d199238616660e80fc05b138a6b5b1d3ec92b # 0.6.8
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: ${{ secrets.SLACK_ACTIONS_CHANNEL_ID }}
          template: result
