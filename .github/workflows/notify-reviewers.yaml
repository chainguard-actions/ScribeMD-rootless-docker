name: Notify Reviewers
on:
  pull_request:
    types:
      - review_requested
jobs:
  notify-reviewers:
    name: Notify Reviewers
    uses: ScribeMD/slack-templates/.github/workflows/notify-reviewers.yaml@501ba2b32c9337d251cb4f486fc95122fa4832dc # 0.6.7
    permissions:
      contents: read
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_REVIEW_CHANNEL_ID: ${{ secrets.SLACK_REVIEW_CHANNEL_ID }}
